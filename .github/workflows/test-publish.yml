name: Test Publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore

    - name: Publish Windows
      run: dotnet publish SH.Launcher/SH.Launcher.csproj /p:PublishProfile=win-x64

    - name: Publish Linux
      run: dotnet publish SH.Launcher/SH.Launcher.csproj /p:PublishProfile=lnx-x64

    - name: Publish macOS
      run: dotnet publish SH.Launcher/SH.Launcher.csproj /p:PublishProfile=mac-x64